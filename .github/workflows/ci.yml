name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend - pruebas unitarias e integracion (JUnit + H2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar pruebas (unitarias + integracion con H2)
        run: mvn test

      - name: Generar reporte de cobertura (JaCoCo)
        run: mvn jacoco:report

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/

  backend-static-analysis:
    name: Backend - analisis estatico (Checkstyle + SpotBugs/FindSecBugs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Checkstyle (no bloqueante)
        run: mvn checkstyle:checkstyle
        continue-on-error: true

      - name: SpotBugs + FindSecBugs (no bloqueante)
        run: mvn compile spotbugs:spotbugs
        continue-on-error: true

      - name: Publicar reportes de analisis estatico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-static-analysis
          path: |
            backend/target/checkstyle-result.xml
            backend/target/spotbugsXml.xml

  frontend-unit-tests:
    name: Frontend - pruebas unitarias (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

  frontend-lint:
    name: Frontend - analisis estatico (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint (no bloqueante)
        run: npx eslint "js/**/*.js"
        continue-on-error: true

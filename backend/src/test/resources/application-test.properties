# ============================================
# Perfil de test - H2 en memoria (Paso 3: pruebas de integracion)
# MODE=PostgreSQL para que schema.sql/data.sql (BIGSERIAL, ILIKE, ||)
# funcionen igual que contra el PostgreSQL real, sin duplicar scripts.
# ============================================

spring.datasource.url=jdbc:h2:mem:hospital_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
